name: Std 5,6 Data Generator

on:
  schedule:
    # 24 કલાકમાં 10 વખત ચાલશે (અંદાજિત દર 2.5 કલાકે)
    - cron: '0 1,3,6,8,11,13,15,18,20,22 * * *' 
  workflow_dispatch: 

jobs:
  generate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install AI Libraries
        run: pip install google-genai

      - name: Run Std 5,6 AI Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_qa.py

      - name: Save Generated Data to Database
        run: |
          git config --global user.name "Std56-AI-Bot"
          git config --global user.email "bot@std56data"
          git add .
          git commit -m "Auto-generated daily data" || echo "No changes to commit"
          git push
          
